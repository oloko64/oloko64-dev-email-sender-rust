[package]
name = "email-sender-rust"
version = "0.3.320"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[profile.release]
lto = "thin"
strip = true

[dependencies]
# This openssl with "vendored" is necessary because the default OpenSSL library is not built for the target architecture (x86_64-unknown-linux-musl)
openssl = { version = "0.10.82", features = ["vendored"] }
dotenvy = "0.15.7"
sendgrid_thin = { version = "0.5.100", default-features = false }
sentry = { version = "0.49.5", features = ["tracing"] }
serde = { version = "1.0.229", features = ["derive"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
serde_json = "1.0.154"
reqwest = { version = "0.13.5", features = ["json"] }
unicode-segmentation = "1.13.3"
tokio = "1.54.1"
axum = "0.8.9"
tracing = "0.1.44"
lambda_http = "1.3.2"
lambda_runtime = "1.5.0"
tower-http = { version = "0.7.1", features = [
    "catch-panic",
    "cors",
    "trace",
    "normalize-path",
] }
regex = "1.13.1"
jiff = { version = "0.2.41", default-features = false, features = ["std"] }
